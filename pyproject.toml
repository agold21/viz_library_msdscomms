[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz-library-msdscomms"
version = "0.1.0"
description = "A visualization library"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]
